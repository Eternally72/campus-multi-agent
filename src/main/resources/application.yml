server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: campus-multi-agent
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:25MB}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/campus_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:campus}
    password: ${MYSQL_PASSWORD:campus123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.format_sql]": false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${AI_CHAT_MODEL:qwen-plus}
          temperature: ${AI_TEMPERATURE:0.3}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-v4}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: campus-agent-producer

campus:
  security:
    jwt-secret: ${JWT_SECRET:campus-multi-agent-local-dev-secret-at-least-32-bytes}
    token-ttl-minutes: ${JWT_TTL_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8088,http://localhost}
  vector:
    datasource:
      jdbc-url: ${PGVECTOR_URL:jdbc:postgresql://localhost:5432/campus_vector}
      username: ${PGVECTOR_USERNAME:campus}
      password: ${PGVECTOR_PASSWORD:campus123}
      driver-class-name: org.postgresql.Driver
    dimensions: ${PGVECTOR_DIMENSIONS:1536}
    initialize-schema: ${PGVECTOR_INITIALIZE_SCHEMA:true}
  upload:
    max-characters: ${DOCUMENT_MAX_CHARACTERS:120000}
  memory:
    short-term-ttl-minutes: ${MEMORY_SHORT_TERM_TTL_MINUTES:1440}
    short-term-max-messages: ${MEMORY_SHORT_TERM_MAX_MESSAGES:16}
    summary-max-characters: ${MEMORY_SUMMARY_MAX_CHARACTERS:3000}
    fact-default-ttl-days: ${MEMORY_FACT_DEFAULT_TTL_DAYS:180}
  rag:
    chunk-size: ${RAG_CHUNK_SIZE:900}
    chunk-overlap: ${RAG_CHUNK_OVERLAP:120}
    top-k: ${RAG_TOP_K:5}
    candidate-k: ${RAG_CANDIDATE_K:12}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.0}
    rerank-enabled: ${RAG_RERANK_ENABLED:true}
    vector-weight: ${RAG_VECTOR_WEIGHT:0.82}
    lexical-weight: ${RAG_LEXICAL_WEIGHT:0.18}
    reranker-model: ${RAG_RERANKER_MODEL:qwen3-rerank}
    reranker-endpoint: ${RAG_RERANKER_ENDPOINT:https://dashscope.aliyuncs.com/compatible-api/v1/reranks}
    reranker-instruction: ${RAG_RERANKER_INSTRUCTION:Given a student question, retrieve the most relevant course material passages that answer the question.}
    reranker-timeout-seconds: ${RAG_RERANKER_TIMEOUT_SECONDS:12}
    local-rerank-fallback: ${RAG_LOCAL_RERANK_FALLBACK:true}
