services:
  campus-api:
    build: .
    container_name: campus-api
    depends_on:
      mysql:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      redis:
        condition: service_started
      rocketmq-namesrv:
        condition: service_started
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/campus_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USERNAME: campus
      MYSQL_PASSWORD: campus123
      PGVECTOR_URL: jdbc:postgresql://pgvector:5432/campus_vector
      PGVECTOR_USERNAME: campus
      PGVECTOR_PASSWORD: campus123
      REDIS_HOST: redis
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-campus-multi-agent-local-dev-secret-at-least-32-bytes}
    ports:
      - "8080:8080"

  campus-nginx:
    image: nginx:1.28-alpine
    container_name: campus-nginx
    depends_on:
      - campus-api
    ports:
      - "8088:80"
    volumes:
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro

  mysql:
    image: mysql:8.4
    container_name: campus-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: campus_agent
      MYSQL_USER: campus
      MYSQL_PASSWORD: campus123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucampus", "-pcampus123"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: campus-pgvector
    environment:
      POSTGRES_DB: campus_vector
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus123
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./pgvector/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_vector"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: campus-redis
    ports:
      - "6379:6379"

  rocketmq-namesrv:
    image: apache/rocketmq:5.5.0
    container_name: campus-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.5.0
    container_name: campus-rocketmq-broker
    depends_on:
      - rocketmq-namesrv
    command: sh mqbroker -n rocketmq-namesrv:9876
    ports:
      - "10911:10911"
      - "10909:10909"

volumes:
  mysql-data:
  pgvector-data:
