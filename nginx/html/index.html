<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>campus-multi-agent</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <aside class="sidebar">
      <div>
        <h1>campus-multi-agent</h1>
        <p class="muted">校园学习与事务智能体工作台</p>
      </div>
      <section class="panel auth-panel">
        <div class="row">
          <input id="username" placeholder="用户名" autocomplete="username">
          <input id="password" type="password" placeholder="密码" autocomplete="current-password">
        </div>
        <input id="displayName" placeholder="昵称">
        <div class="actions">
          <button id="loginBtn">登录</button>
          <button id="registerBtn" class="secondary">注册</button>
        </div>
        <p id="authState" class="state">未登录</p>
      </section>
      <nav class="nav">
        <button class="active" data-view="chat">对话</button>
        <button data-view="courses">课程</button>
        <button data-view="materials">资料</button>
        <button data-view="todos">待办</button>
      </nav>
    </aside>

    <section class="content">
      <section id="chat" class="view active">
        <header class="view-header">
          <div>
            <h2>多 Agent 对话</h2>
            <p class="muted">Router Agent 会自动分派到课程问答、学习规划、资料总结或校园事务 Agent。</p>
          </div>
          <button id="newSessionBtn" class="secondary">新会话</button>
        </header>
        <div id="messages" class="messages"></div>
        <div class="composer">
          <textarea id="chatInput" rows="3" placeholder="例如：帮我总结操作系统资料里的进程调度重点"></textarea>
          <button id="sendBtn">发送</button>
        </div>
      </section>

      <section id="courses" class="view">
        <header class="view-header">
          <h2>课程</h2>
        </header>
        <form id="courseForm" class="form-grid">
          <input name="name" placeholder="课程名" required>
          <input name="term" placeholder="学期，如 2026 春">
          <input name="teacher" placeholder="教师">
          <button>新增课程</button>
        </form>
        <div id="courseList" class="list"></div>
      </section>

      <section id="materials" class="view">
        <header class="view-header">
          <h2>课程资料</h2>
        </header>
        <form id="materialForm" class="stack">
          <input name="title" placeholder="资料标题" required>
          <input name="courseId" placeholder="课程 ID，可选">
          <textarea name="content" rows="10" placeholder="粘贴课程资料文本，第一版先支持文本上传" required></textarea>
          <button>上传并索引</button>
        </form>
        <div id="materialList" class="list"></div>
      </section>

      <section id="todos" class="view">
        <header class="view-header">
          <h2>待办</h2>
        </header>
        <form id="todoForm" class="form-grid">
          <input name="title" placeholder="待办标题" required>
          <input name="dueDate" type="date">
          <input name="description" placeholder="说明">
          <button>创建待办</button>
        </form>
        <div id="todoList" class="list"></div>
      </section>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
